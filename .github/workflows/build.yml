function inferFileName(lang){
 return ({html:"index.html",htm:"index.html",css:"style.css",js:"script.js",javascript:"script.js",ts:"script.ts",
 typescript:"script.ts",lua:"script.lua",py:"main.py",python:"main.py",json:"data.json",xml:"data.xml",sql:"query.sql",
 java:"Main.java",cpp:"main.cpp",c:"main.c",rs:"main.rs",rust:"main.rs",go:"main.go",php:"index.php",sh:"script.sh",
 bash:"script.sh",yaml:"config.yml",yml:"config.yml"})[(lang||"").toLowerCase()]||"code.txt";
}
function parseCodeFiles(text){
 const re=/```(?:([\w+#.-]+))?(?:\s+filename[=:]([^\s`]+))?\s*\n([\s\S]*?)(?:```|$)/g;
 let m,files=[],fallback=0;
 while((m=re.exec(text))){
   const lang=(m[1]||"text").toLowerCase(), name=m[2]||inferFileName(lang);
   files.push({name,lang,code:m[3].trimEnd()});
   fallback++;
 }
 if(!files.length)return null;
 // If the model forgot filename= on repeated same-language blocks, make unique names.
 const used={};
 files.forEach(f=>{if(used[f.name]){used[f.name]++;const dot=f.name.lastIndexOf(".");f.name=f.name.slice(0,dot)+"-"+used[f.name]+f.name.slice(dot)}else used[f.name]=1});
 return files;
}
function extractCode(text){const files=parseCodeFiles(text);return files?files[0]:null}
function stripCode(text){return text.replace(/```(?:[\w+#.-]+)?(?:\s+filename[=:][^\s`]+)?\s*\n[\s\S]*?(?:```|$)/g,"").replace(/\n{3,}/g,"\n\n").trim()}

function escHtml(v){return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function isRunnableFile(f){return /\.(html?|xhtml)$/i.test(f.name)}
function projectTitle(files){const html=files.find(f=>isRunnableFile(f));return html?html.name:"مشروع مولّد"}
function buildProjectSrcdoc(files,mainName){
 const htmlFile=files.find(f=>f.name===mainName)||files.find(isRunnableFile);
 if(!htmlFile)return "";
 let doc=htmlFile.code;
 const normalizePath=v=>String(v||"").replace(/^\.\//,"").replace(/^\.\.\//,"").replace(/^\//,"");
 const localFile=(src,ext)=>{
   const clean=normalizePath(decodeURIComponent(String(src||"").split(/[?#]/)[0]));
   return files.find(f=>normalizePath(f.name)===clean && (!ext || new RegExp(ext,"i").test(f.name)));
 };
 const escScript=code=>String(code).replace(/<\/script/gi,"<\/script");
 const cssFiles=files.filter(f=>/\.css$/i.test(f.name));
 const jsFiles=files.filter(f=>/\.m?js$/i.test(f.name));
 doc=doc.replace(/<link([^>]+)href=["']([^"']+\.css(?:[?#][^"']*)?)["']([^>]*)>/gi,(full,a,href,b)=>{
   const f=localFile(href,"\.css$");
   return f?`<style data-generated-project-css data-source="${escHtml(f.name)}">\n${f.code}\n</style>`:full;
 });
 if(cssFiles.length && !/<style[^>]*data-generated-project-css/i.test(doc)){
   const css=cssFiles.map(f=>`/* ${f.name} */\n${f.code}`).join("\n\n");
   const cssTag=`<style data-generated-project-css>\n${css}\n</style>`;
   if(/<\/head>/i.test(doc))doc=doc.replace(/<\/head>/i,cssTag+"</head>");else doc=cssTag+doc;
 }
 doc=doc.replace(/<script([^>]+)src=["']([^"']+\.m?js(?:[?#][^"']*)?)["']([^>]*)><\/script>/gi,(full,a,src,b)=>{
   const f=localFile(src,"\.m?js$");
   if(!f)return full;
   const attrs=(a+b).replace(/\\s+src=["'][^"']+["']/i,"");
   return `<script${attrs}>\n${escScript(f.code)}\n<\/script>`;
 });
 const referencedLocalJs=jsFiles.some(f=>new RegExp(`(?:src|import)[\\s\\S]*${f.name.replace(/[.*+?^${}()|[\\]\\\\]/g,"\\\\$&")}`).test(doc));
 if(jsFiles.length && !referencedLocalJs){
   const js=jsFiles.map(f=>`// ===== ${f.name} =====\n${escScript(f.code)}`).join("\n\n");
   const jsTag=`<script data-generated-project-js>\n${js}\n<\/script>`;
   if(/<\/body>/i.test(doc))doc=doc.replace(/<\/body>/i,jsTag+"</body>");else doc+=jsTag;
 }
 return doc;
}
