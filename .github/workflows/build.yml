let viewerScale=1,viewerX=0,viewerY=0,viewerPointers=new Map(),viewerPinchStart=0,viewerPinchScale=1,viewerDragStart=null;
function paintViewerImage(){
 const image=document.getElementById("polliViewerImage");
 if(image)image.style.transform=`translate3d(${viewerX}px,${viewerY}px,0) scale(${viewerScale})`;
}
function resetViewerTransform(){
 viewerScale=1;viewerX=0;viewerY=0;viewerPointers.clear();viewerDragStart=null;viewerPinchStart=0;paintViewerImage();
}
function clampViewerPan(){
 const image=document.getElementById("polliViewerImage");
 const box=image?.parentElement;
 if(!image||!box)return;
 const bw=box.clientWidth,bh=box.clientHeight;
 const iw=image.naturalWidth||image.width, ih=image.naturalHeight||image.height;
 const dispW=Math.min(bw,iw)*viewerScale;
 const dispH=Math.min(bh,ih)*viewerScale;
 const maxX=Math.max(0,(dispW-bw)/2);
 const maxY=Math.max(0,(dispH-bh)/2);
 viewerX=Math.max(-maxX,Math.min(maxX,viewerX));
 viewerY=Math.max(-maxY,Math.min(maxY,viewerY));
}
function setViewerZoom(next,cx,cy){
 const image=document.getElementById("polliViewerImage");
 const box=image?.parentElement;
 const prev=viewerScale;
 viewerScale=Math.max(1,Math.min(8,next));
 if(viewerScale===1){viewerX=0;viewerY=0;}
 else if(box&&cx!=null&&cy!=null){
  const rect=box.getBoundingClientRect();
  const ox=cx-rect.left-rect.width/2;
  const oy=cy-rect.top-rect.height/2;
  const ratio=viewerScale/prev;
  viewerX=ox-(ox-viewerX)*ratio;
  viewerY=oy-(oy-viewerY)*ratio;
 }
 clampViewerPan();
 paintViewerImage();
}
function openPolliViewer(src){
 const viewer=document.getElementById("polliViewer"),image=document.getElementById("polliViewerImage");
 if(!viewer||!image)return;
 image.src=src;
 resetViewerTransform();
 viewer.classList.add("open");
}
function closePolliViewer(){
 const viewer=document.getElementById("polliViewer");
 if(viewer)viewer.classList.remove("open");
 resetViewerTransform();
 stopHoldZoom();
}
function viewerDistance(){
 const pts=[...viewerPointers.values()];
 if(pts.length<2)return 0;
 return Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);
}
function viewerCenter(){
 const pts=[...viewerPointers.values()];
 if(pts.length<2)return null;
 return {x:(pts[0].x+pts[1].x)/2,y:(pts[0].y+pts[1].y)/2};
}
(function setupTouchViewer(){
 const viewer=document.getElementById("polliViewer");
 const image=document.getElementById("polliViewerImage");
 const box=viewer?.querySelector(".polli-viewer-box");
 if(!viewer||!image||!box)return;

 image.addEventListener("pointerdown",e=>{
  if(!viewer.classList.contains("open"))return;
  if(e.pointerType==="mouse"&&e.button!==0)return;
  e.preventDefault();
  try{image.setPointerCapture(e.pointerId)}catch(_){}
  viewerPointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(viewerPointers.size===1){
   viewerDragStart={x:e.clientX,y:e.clientY,baseX:viewerX,baseY:viewerY};
   image.style.cursor="grabbing";
  }else if(viewerPointers.size===2){
   viewerPinchStart=viewerDistance();
   viewerPinchScale=viewerScale;
   viewerDragStart=null;
  }
 });

 window.addEventListener("pointermove",e=>{
  if(!viewerPointers.has(e.pointerId))return;
  viewerPointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(viewerPointers.size>=2){
   const d=viewerDistance();
   if(viewerPinchStart>0 && d>0){
    const c=viewerCenter();
    const target=viewerPinchScale*(d/viewerPinchStart);
    setViewerZoom(target,c?.x,c?.y);
   }
  }else if(viewerDragStart && viewerScale>1){
   viewerX=viewerDragStart.baseX+(e.clientX-viewerDragStart.x);
   viewerY=viewerDragStart.baseY+(e.clientY-viewerDragStart.y);
   clampViewerPan();
   paintViewerImage();
  }
 },{passive:false});

 const end=e=>{
  if(!viewerPointers.has(e.pointerId))return;
  viewerPointers.delete(e.pointerId);
  try{image.releasePointerCapture(e.pointerId)}catch(_){}
  if(viewerPointers.size===1){
   const p=[...viewerPointers.values()][0];
   viewerDragStart={x:p.x,y:p.y,baseX:viewerX,baseY:viewerY};
   viewerPinchStart=0;
  }else{
   viewerDragStart=null;viewerPinchStart=0;
   image.style.cursor="grab";
  }
 };
 window.addEventListener("pointerup",end);
 window.addEventListener("pointercancel",end);

 viewer.addEventListener("touchstart",e=>{e.preventDefault()},{passive:false});
 viewer.addEventListener("touchmove",e=>{e.preventDefault()},{passive:false});
 viewer.addEventListener("gesturestart",e=>{e.preventDefault()},{passive:false});

 image.addEventListener("wheel",e=>{
  e.preventDefault();
  setViewerZoom(viewerScale+(e.deltaY<0?0.2:-0.2),e.clientX,e.clientY);
 },{passive:false});

 image.addEventListener("dblclick",e=>{
  e.preventDefault();
  if(viewerScale>1)setViewerZoom(1);
  else setViewerZoom(2,e.clientX,e.clientY);
 });
})();

/* ==== أزرار تحريك الصورة يدويًا ==== */
function setupPolliPan(){
 const left=document.getElementById("polliPanLeft");
 const right=document.getElementById("polliPanRight");
 let timer=null, direction=0;
 const STEP=8;
 const tick=()=>{
  if(!direction) return;
  if(viewerScale<=1){ direction=0; return; }
  viewerX += direction * STEP;
  clampViewerPan();
  paintViewerImage();
  timer=requestAnimationFrame(tick);
 };
 const start=(dir,e)=>{
  if(e) e.preventDefault();
  direction=dir;
  if(timer) cancelAnimationFrame(timer);
  timer=requestAnimationFrame(tick);
 };
 const stop=()=>{ direction=0; if(timer){cancelAnimationFrame(timer);timer=null;} };

 [left,right].forEach(btn=>{
  if(!btn) return;
  btn.addEventListener("pointerdown",e=>{ start(btn===left?-1:1,e); btn.setPointerCapture?.(e.pointerId); });
  btn.addEventListener("pointerup",stop);
  btn.addEventListener("pointercancel",stop);
  btn.addEventListener("pointerleave",stop);
  btn.addEventListener("lostpointercapture",stop);
 });
}

/* ==== زوم مستمر عند الضغط المطول على ＋ أو − ==== */
let holdZoomRAF=null, holdZoomDir=0, holdZoomStart=0, holdZoomBtn=null;
function startHoldZoom(btn, dir){
 stopHoldZoom();
 holdZoomBtn=btn;
 btn.classList.add("hold-zoom");
 holdZoomDir=dir;
 holdZoomStart=performance.now();
 const loop=()=>{
  if(!holdZoomDir) return;
  const elapsed=performance.now()-holdZoomStart;
  const speed=Math.min(0.07, 0.01 + elapsed/1800*0.06);
  const image=document.getElementById("polliViewerImage");
  const box=image?.parentElement;
  if(box){
   const rect=box.getBoundingClientRect();
   setViewerZoom(viewerScale + holdZoomDir*speed, rect.left+rect.width/2, rect.top+rect.height/2);
  }
  if(viewerScale<=1 && holdZoomDir<0){ stopHoldZoom(); return; }
  holdZoomRAF=requestAnimationFrame(loop);
 };
 loop();
}
function stopHoldZoom(){
 if(holdZoomRAF){cancelAnimationFrame(holdZoomRAF);holdZoomRAF=null;}
 holdZoomDir=0;
 if(holdZoomBtn){holdZoomBtn.classList.remove("hold-zoom");holdZoomBtn=null;}
}
function setupHoldZoom(){
 const tools=document.querySelectorAll(".polli-viewer-tools button");
 tools.forEach(btn=>{
  const label=btn.getAttribute("aria-label")||"";
  let dir=0;
  if(label.includes("تكبير")) dir=1;
  else if(label.includes("تصغير")) dir=-1;
  if(!dir) return;
  const down=e=>{e.preventDefault();e.stopPropagation();startHoldZoom(btn,dir);};
  const up=e=>{e.preventDefault();e.stopPropagation();stopHoldZoom();};
  btn.addEventListener("pointerdown",down);
  btn.addEventListener("pointerup",up);
  btn.addEventListener("pointercancel",up);
  btn.addEventListener("pointerleave",up);
  btn.addEventListener("lostpointercapture",up);
  btn.addEventListener("contextmenu",e=>e.preventDefault());
 });
}

/* ==== لوحة المفاتيح: الأسهم لتحريك الصورة ==== */
function setupPolliKeyboard(){
 document.addEventListener("keydown",e=>{
  const viewer=document.getElementById("polliViewer");
  if(!viewer||!viewer.classList.contains("open"))return;
  const step=40;
  if(e.key==="ArrowRight"){ e.preventDefault(); if(viewerScale>1){viewerX-=step;clampViewerPan();paintViewerImage();} }
  else if(e.key==="ArrowLeft"){ e.preventDefault(); if(viewerScale>1){viewerX+=step;clampViewerPan();paintViewerImage();} }
  else if(e.key==="ArrowUp"){ e.preventDefault(); if(viewerScale>1){viewerY+=step;clampViewerPan();paintViewerImage();} }
  else if(e.key==="ArrowDown"){ e.preventDefault(); if(viewerScale>1){viewerY-=step;clampViewerPan();paintViewerImage();} }
  else if(e.key==="Escape"){ closePolliViewer(); }
 });
}

setupPolliPan();
setupHoldZoom();
setupPolliKeyboard();

async function downloadPolliImage(src){
 let blobUrl=null;
 const filename=`Mohammed-AI-${Date.now()}.png`;
 try{
  const res=await fetch(src,{mode:"cors",credentials:"omit"});
  if(!res.ok)throw new Error("تعذّر جلب ملف الصورة من الخادم");
  const blob=await res.blob();
  const mime=blob.type||"image/png";
  const ext=mime.includes("jpeg")?"jpg":(mime.split("/")[1]||"png").replace(/[^a-z0-9]/gi,"");
  const file=new File([blob],`Mohammed-AI-${Date.now()}.${ext}`,{type:mime});
  if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
   try{
    await navigator.share({files:[file],title:"Mohammed AI",text:"الصورة التي أنشأها Mohammed AI"});
    toast("اختر تطبيق الصور أو المعرض ثم اضغط حفظ");
    return;
   }catch(shareError){
    if(shareError && shareError.name==="AbortError")return;
   }
  }
  blobUrl=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=blobUrl;a.download=`Mohammed-AI-${Date.now()}.${ext}`;
  a.style.display="none";document.body.appendChild(a);a.click();a.remove();
  toast("بدأ تنزيل الصورة إلى ملفات التنزيلات على جهازك");
 }catch(error){
  const opened=window.open(src,"_blank","noopener,noreferrer");
  if(opened){
   toast("فتحنا الصورة الأصلية؛ من قائمة المتصفح اختر تنزيل الصورة أو حفظها");
  }else{
   const a=document.createElement("a");a.href=src;a.target="_blank";a.rel="noopener noreferrer";
   document.body.appendChild(a);a.click();a.remove();
   toast("تعذّر التنزيل المباشر بسبب قيود الخادم؛ افتح الصورة واحفظها من المتصفح");
  }
 }finally{
  if(blobUrl)setTimeout(()=>URL.revokeObjectURL(blobUrl),10000);
 }
}
function detectIntent(text,images,files){
 const raw=(text||"").trim();
 const t=raw.toLowerCase();

 if(images && images.length) return "vision";

 const imageAction=/(ارسم|ارسِم|اصنع|اصنعلي|سوي|سوّي|اعمل|اعملي|أنشئ|انشئ|صمّم|صمم|ولّد|ولد|طلّع|طلع|generate|create|draw|make|render|design)/i;
 const imageNoun=/(صورة|صوره|رسم|رسمة|سيارة|سياره|bugatti|لامبورغيني|فيراري|منظر|شخصية|شخص|قطة|كلب|بيت|مدينة|شعار|خلفية|image|picture|photo|artwork|illustration|car|vehicle|logo|wallpaper|portrait|landscape)/i;
 const explicitImage=/(صورة|صوره|image|picture|photo|artwork|illustration|wallpaper|portrait)/i.test(t);
 const hasAction=imageAction.test(t);
 const hasSubject=imageNoun.test(t);
 if((hasAction && hasSubject) || (explicitImage && /(لـ|ل |عن|of|for|about)/i.test(t))) return "image";

 const codeIntent=/(كود|اكواد|أكواد|سكربت|برمج|html|css|javascript|java|python|lua|code|script|website|موقع|تطبيق|برنامج|لعبة|صفحة ويب|مشروع|صلح الكود|صحح الكود|عدّل الكود|عدل الكود|اكتب لي كود|اكتب كود|اكتب سكربت|اصنع لعبة|أنشئ لعبة|انشئ لعبة|build me|make a website|develop|programming)/i.test(t);
 const huge=/(ضخم|ضخمة|ضخما|كبير جدا|كبيرة جدا|متكامل جدا|عملاق|عملاقة|enterprise|large[- ]scale|massive|full[- ]scale|huge)/i.test(t);
 if(codeIntent && huge) return "huge-code";
 if(codeIntent) return "code";

 if(files && files.length) return "file";
 return "chat";
}
function routeModel(intent){
 const ids={
  chat:"meta-llama/llama-3.3-70b-instruct",
  vision:"qwen/qwen3-vl-30b-a3b-instruct",
  code:"cohere/north-mini-code:free",
  "huge-code":"nvidia/nemotron-3-ultra-550b-a55b-20260604:free",
  file:"meta-llama/llama-3.3-70b-instruct"
 };
 return ids[intent]||ids.chat;
}
function waitForIntent(ms=2000){
 return new Promise(resolve=>setTimeout(resolve,ms));
}
async function sendMessage(){
 const text=msgInput.value.trim();
 if(!text || busy) return;

 const files=[...pendingFiles], images=[...pendingImages];
 busy=true;
 sendBtn.disabled=true;
 const oldSendText=sendBtn.innerHTML;

 try{
  await waitForIntent(2000);
  const intent=detectIntent(text,images,files);

  if(intent==="image"){
   busy=false;
   sendBtn.disabled=false;
   sendBtn.innerHTML=oldSendText;
   await generatePollinationsImage(text);
   return;
  }

  if(!apiKey){
   toast("أضف مفتاح OpenRouter واضغط حفظ المفتاح");
   $("sidebar").classList.add("open");
   return;
  }

  const chosenModel=routeModel(intent);
  modelSelect.value=chosenModel;

  addMessage(
   text+
   (files.length?"\n\n📎 "+files.map(f=>f.name).join(" · "):"")+
   (images.length?"\n\n🖼️ "+images.map(f=>f.name).join(" · "):""),
   "user",null,null,images.map(f=>URL.createObjectURL(f))
  );
  msgInput.value="";
  pendingFiles=[];
  pendingImages=[];
  renderAttachmentChips();
  resizeInput();

  const live=makeLiveAssistant();
  live.lab.innerHTML='<span class="thinking-word">يفكر...</span>';
  live.tc.textContent="تم تحليل نوع الطلب بعد مهلة قصيرة. يجري الآن اختيار النموذج المناسب وإعداد المرفقات.";

  try{
   const parts=[];
   for(const f of images){
    const data=await imageDataURL(f);
    parts.push({type:"image_url",image_url:{url:data}});
   }
   for(const f of files){
    parts.push({type:"text",text:`\n\n[ملف مرفق: ${f.name}]\n${await fileToText(f)}`});
   }

   messages.push({role:"user",content:parts.length?[{type:"text",text},...parts]:text});

   const generalSystem={
    role:"system",
    content:"أنت مساعد ذكي ومحادث طبيعي. أجب عن الحديث والأسئلة بشكل طبيعي ومباشر. لا تنشئ كودًا أو HTML أو ملفات أو مشاريع أو صورًا من تلقاء نفسك؛ لا تكتب كودًا إلا إذا طلب المستخدم ذلك بوضوح. لا تحوّل مجرد ذكر اسم سيارة أو شيء إلى طلب صورة. إذا كان الطلب غامضًا فاسأل سؤالًا قصيرًا للتوضيح. أجب بلغة المستخدم."
   };
   const codeSystem={
    role:"system",
    content:"أنت مساعد برمجة. المستخدم طلب مساعدة برمجية. اكتب تنفيذًا عمليًا كاملًا بقدر ما طلبه المستخدم، ولا تختصر أجزاء أساسية. إذا كان المشروع متعدد الملفات، ضع كل ملف في code fence منفصل واذكر اسمه في سطر قبله. لا تضف معاينة أو تشغيلًا أو أزرارًا؛ واجهة المستخدم تعرض زر نسخ فقط. لا تفترض متطلبات لم يطلبها المستخدم."
   };
   const visionSystem={
    role:"system",
    content:"أنت مساعد يفهم الصور. افحص الصورة المرفقة فعليًا، ثم أجب عن طلب المستخدم اعتمادًا على ما يظهر فيها. لا تدّع رؤية تفاصيل غير واضحة."
   };

   const extraSystem=intent==="vision"?[visionSystem]:(intent==="code"||intent==="huge-code"?[codeSystem]:[]);
   const requestMessages=[generalSystem,...extraSystem,...messages];
   const payload={model:chosenModel,messages:requestMessages,temperature:.65,max_tokens:intent==="huge-code"?24000:16384,stream:true};

   const result=await startGenerationWorker(payload,apiKey,data=>{
    if(data.replyDelta) live.lab.innerHTML='<span class="thinking-word">يكتب الرد...</span>';
   });
   if(!result.reply) throw new Error("وصل رد من النموذج دون نص ظاهر.");

   messages.push({role:"assistant",content:result.reply});
   live.think.classList.add("finished");
   live.lab.textContent="اكتمل الرد";
   live.tc.textContent="تم إنشاء الإجابة بنجاح";
   const rendered=window.marked?marked.parse(result.reply):result.reply;
   live.bubble.innerHTML=window.DOMPurify?DOMPurify.sanitize(rendered):rendered;
   live.bubble.querySelectorAll("pre code").forEach(code=>{if(window.hljs)hljs.highlightElement(code)});
   live.bubble.querySelectorAll("a").forEach(a=>{a.target="_blank";a.rel="noopener noreferrer"});
   renderCodeFile(live.bubble,result.reply,false);
   setStatus("جاهز",true);
   safeScrollBottom();
  }catch(err){
   live.row.remove();
   if(err.name!=="AbortError") addMessage(err.message||"حدث خطأ غير معروف","assistant");
   setStatus("تعذّر إكمال الطلب");
  }
 }catch(err){
  if(err.name!=="AbortError") toast(err.message||"حدث خطأ أثناء تحليل الطلب");
 }finally{
  activeController=null;
  busy=false;
  sendBtn.disabled=false;
  sendBtn.innerHTML=oldSendText;
  safeScrollBottom();
 }
}
function resizeInput(){msgInput.style.height="auto";msgInput.style.height=Math.min(msgInput.scrollHeight,180)+"px"}
msgInput.addEventListener("input",resizeInput);
msgInput.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage()}});
sendBtn.onclick=sendMessage;
loadKey();loadPollinationsKey();syncModel();syncThinking();
</script>
<div class="polli-viewer" id="polliViewer" onclick="if(event.target===this)closePolliViewer()">
  <div class="polli-viewer-box">
    <button class="polli-viewer-close" type="button" onclick="closePolliViewer()" aria-label="إغلاق">✕</button>
    <button class="polli-nav prev" id="polliPanLeft" type="button" aria-label="تحريك الصورة لليسار">‹</button>
    <button class="polli-nav next" id="polliPanRight" type="button" aria-label="تحريك الصورة لليمين">›</button>
    <img id="polliViewerImage" alt="الصورة التي أنشأها Mohammed AI"/>
    <div class="polli-viewer-tools" aria-label="أدوات تكبير الصورة">
      <button type="button" onclick="setViewerZoom(viewerScale+0.35)" aria-label="تكبير">＋</button>
      <button type="button" onclick="setViewerZoom(viewerScale-0.35)" aria-label="تصغير">−</button>
      <button type="button" onclick="resetViewerTransform()" aria-label="إظهار الصورة كاملة">↺</button>
    </div>
