function startGenerationWorker(payload,key,onChunk){
 return new Promise((resolve,reject)=>{
  const workerCode=`self.onmessage=async(e)=>{
   const {payload,key,url}=e.data;
   try{
    const res=await fetch(url,{method:"POST",headers:{
     "Authorization":"Bearer "+key,"Content-Type":"application/json",
     "HTTP-Referer":location.href,"X-Title":"Mohammed AI"
    },body:JSON.stringify(payload)});
    if(!res.ok){const t=await res.text();self.postMessage({type:"error",error:"HTTP "+res.status+": "+t.slice(0,500)});return}
    const reader=res.body.getReader(),decoder=new TextDecoder();
    let buffer="",reply="",reasoning="";
    while(true){
     const {value,done}=await reader.read();if(done)break;
     buffer+=decoder.decode(value,{stream:true});
     const lines=buffer.split(/\\r?\\n/);buffer=lines.pop()||"";
     for(const line of lines){
      if(!line.startsWith("data:"))continue;
      const raw=line.slice(5).trim();if(!raw||raw==="[DONE]")continue;
      let j;try{j=JSON.parse(raw)}catch{continue}
      const d=j.choices?.[0]?.delta||{};
      if(typeof d.content==="string")reply+=d.content;
      if(typeof d.reasoning==="string")reasoning+=d.reasoning;
      if(typeof d.reasoning_content==="string")reasoning+=d.reasoning_content;
      if(Array.isArray(d.reasoning_details))reasoning+=d.reasoning_details.map(x=>x.text||x.summary||"").filter(Boolean).join("");
      self.postMessage({type:"chunk",replyDelta:d.content||"",reasoningDelta:(d.reasoning||d.reasoning_content||""),reply,reasoning});
     }
    }
    self.postMessage({type:"done",reply,reasoning});
   }catch(err){self.postMessage({type:"error",error:err.name==="AbortError"?"تم الإيقاف":(err.message||"خطأ غير معروف")})}
  };`;
  const blob=new Blob([workerCode],{type:"application/javascript"});
  const w=new Worker(URL.createObjectURL(blob));window.__generationWorker=w;
  w.onmessage=e=>{
   if(e.data.type==="chunk")onChunk(e.data);
   else if(e.data.type==="done"){w.terminate();URL.revokeObjectURL(blob);if(window.__generationWorker===w)window.__generationWorker=null;resolve(e.data)}
   else if(e.data.type==="error"){w.terminate();URL.revokeObjectURL(blob);if(window.__generationWorker===w)window.__generationWorker=null;reject(new Error(e.data.error))}
  };
  w.onerror=()=>{w.terminate();URL.revokeObjectURL(blob);if(window.__generationWorker===w)window.__generationWorker=null;reject(new Error("تعذر تشغيل مولد الخلفية"))};
  w.postMessage({payload,key,url:API_URL});
 });
}
function stopGenerationWorker(){if(window.__generationWorker){window.__generationWorker.terminate();window.__generationWorker=null;return true}return false}

