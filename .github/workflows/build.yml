async function fetchPollinationsImage(prompt,key){
 const seed=Math.floor(Math.random()*1000000);
 let url="https://gen.pollinations.ai/image/"+encodeURIComponent(prompt)+
  "?width=1280&height=1280&seed="+seed+"&nologo=true&model=flux";
 if(key)url+="&key="+encodeURIComponent(key);

 const image=new Image();
 image.decoding="async";
 image.referrerPolicy="no-referrer";
 await new Promise((resolve,reject)=>{
  let settled=false;
  const timer=setTimeout(()=>{
   if(settled)return;
   settled=true;
   image.src="";
   reject(new Error("انتهت مهلة تحميل الصورة. تحقق من الاتصال ومفتاح Pollinations."));
  },120000);
  image.onload=()=>{
   if(settled)return;
   settled=true;clearTimeout(timer);
   if(image.naturalWidth>0)resolve();
   else reject(new Error("وصل رد بدون صورة صالحة"));
  };
  image.onerror=()=>{
   if(settled)return;
   settled=true;clearTimeout(timer);
   reject(new Error("فشل تحميل الصورة من Pollinations. تحقق من المفتاح أو الرصيد أو جرّب وصفًا آخر."));
  };
  image.src=url;
 });
 return {url,image};
}

